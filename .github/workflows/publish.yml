name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify Git tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Refusing to publish from a non-tag ref ($GITHUB_REF_TYPE '$GITHUB_REF_NAME'). Publish must run from a v<version> tag or a Release that points at one."
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *)
              echo "::error::Tag '$GITHUB_REF_NAME' does not use the required v<version> format."
              exit 1
              ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Verified tag version $TAG_VERSION matches package.json version $PKG_VERSION"

      - name: Run full release verification suite
        run: npm run release:check

      - name: Determine dist-tag
        id: dist-tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" == *"-"* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version $PKG_VERSION under dist-tag '$DIST_TAG'"

      # Auth comes from npm Trusted Publishing (OIDC) via the id-token: write
      # permission, which also attests provenance. No npm token is stored.
      - name: Publish package to npm
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }} --provenance
