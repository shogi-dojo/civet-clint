name: CI

on:
  push:
    branches: [main, feat/*, fix/*, chore/*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Type-check public API
        run: npm run typecheck

      - name: Run self-check
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      # Packing, installing and running the tarball is slow, so it is gated to a
      # single Node version to keep the matrix runtime in check.
      - name: Packaged install smoke test
        if: matrix.node-version == '24.x'
        run: npm run smoke-test
